<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Align-cDAE graphical highlight</title>
  <desc id="desc">Clinical conditions align with anatomical attention to generate a precise follow-up MRI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff8f3"/>
      <stop offset="1" stop-color="#ffe6d5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#e9490a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#ef6114"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="150" fill="#ff7a18" opacity=".08"/>
  <text x="60" y="82" fill="#b83a08" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="4">ALIGNED PROGRESSION</text>
  <g filter="url(#shadow)">
    <rect x="65" y="145" width="255" height="350" rx="34" fill="#fff"/>
    <rect x="472" y="145" width="255" height="350" rx="34" fill="#fff"/>
    <rect x="880" y="145" width="255" height="350" rx="34" fill="#fff"/>
  </g>
  <g transform="translate(118 190)">
    <rect width="150" height="180" rx="22" fill="#18201d"/>
    <ellipse cx="75" cy="90" rx="57" ry="74" fill="#d6d8d4"/>
    <path d="M75 25C49 34 39 58 43 83c4 25 17 54 32 71M75 25c26 9 36 33 32 58-4 25-17 54-32 71" fill="none" stroke="#7d827d" stroke-width="8"/>
    <path d="M61 73c-10 16-8 37 14 42 22-5 24-26 14-42-4 10-8 14-14 14s-10-4-14-14Z" fill="#303733"/>
  </g>
  <text x="192" y="422" text-anchor="middle" fill="#27312d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Baseline MRI</text>
  <g transform="translate(507 184)">
    <circle cx="93" cy="92" r="76" fill="url(#accent)"/>
    <path d="M45 92h96M93 44v96M59 58l68 68M127 58l-68 68" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".9"/>
    <circle cx="93" cy="92" r="27" fill="#fff"/>
    <path d="M75 92l12 12 25-29" fill="none" stroke="#ef6114" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="600" y="443" text-anchor="middle" fill="#b83a08" font-family="Arial,sans-serif" font-size="34" font-weight="700">Align-cDAE</text>
  <g transform="translate(933 190)">
    <rect width="150" height="180" rx="22" fill="#18201d"/>
    <ellipse cx="75" cy="90" rx="61" ry="76" fill="#e1e2df"/>
    <path d="M75 24C47 33 36 58 41 84c5 27 19 55 34 71M75 24c28 9 39 34 34 60-5 27-19 55-34 71" fill="none" stroke="#858a85" stroke-width="8"/>
    <path d="M60 70c-12 18-9 42 15 48 24-6 27-30 15-48-4 11-9 16-15 16s-11-5-15-16Z" fill="#303733"/>
    <path d="M24 137c25-20 77-20 102 0" fill="none" stroke="#ff7a18" stroke-width="7" opacity=".8"/>
  </g>
  <text x="1008" y="422" text-anchor="middle" fill="#27312d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Precise follow-up</text>
  <path d="M330 320H450" stroke="#ef6114" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M738 320H858" stroke="#ef6114" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="270" y="552" width="660" height="70" rx="35" fill="#fff" opacity=".88"/>
  <text x="600" y="598" text-anchor="middle" fill="#b83a08" font-family="Arial,sans-serif" font-size="31" font-weight="700">CONDITION  ·  ALIGN  ·  GENERATE</text>
