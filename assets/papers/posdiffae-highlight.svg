<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">PosDiffAE graphical highlight</title>
  <desc id="desc">Position-aware histology representations support regional understanding and artifact restoration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#eee5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b2db7"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#7141cc"/>
    </marker>
    <pattern id="cells" width="45" height="45" patternUnits="userSpaceOnUse">
      <rect width="45" height="45" fill="#f1d9ee"/>
      <circle cx="10" cy="13" r="5" fill="#6741a5"/>
      <circle cx="31" cy="8" r="4" fill="#9669cf"/>
      <ellipse cx="26" cy="31" rx="6" ry="4" fill="#7449ae"/>
      <circle cx="6" cy="37" r="3" fill="#9f78ca"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <circle cx="1110" cy="570" r="210" fill="#7c4ed4" opacity=".07"/>
  <text x="60" y="82" fill="#51248f" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="4">POSITION-AWARE HISTOLOGY</text>
  <g filter="url(#shadow)">
    <rect x="65" y="145" width="255" height="350" rx="34" fill="#fff"/>
    <rect x="472" y="145" width="255" height="350" rx="34" fill="#fff"/>
    <rect x="880" y="145" width="255" height="350" rx="34" fill="#fff"/>
  </g>
  <rect x="118" y="190" width="150" height="180" rx="22" fill="url(#cells)" stroke="#7544be" stroke-width="6"/>
  <path d="M139 218c42 30 65 71 108 122" fill="none" stroke="#fff" stroke-width="16" opacity=".9"/>
  <text x="192" y="422" text-anchor="middle" fill="#30283a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Histology patch</text>
  <g transform="translate(505 177)">
    <circle cx="95" cy="100" r="86" fill="#f2ebff" stroke="#8253d6" stroke-width="5"/>
    <circle cx="95" cy="100" r="58" fill="none" stroke="#a98ae3" stroke-width="4" stroke-dasharray="10 9"/>
    <path d="M95 14v172M9 100h172" stroke="#7544be" stroke-width="4" opacity=".65"/>
    <path d="M95 100 151 55" stroke="#6335b0" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <circle cx="95" cy="100" r="13" fill="url(#accent)"/>
    <text x="95" y="248" text-anchor="middle" fill="#51248f" font-family="Arial,sans-serif" font-size="31" font-weight="700">PosDiffAE</text>
  </g>
  <g transform="translate(925 180)">
    <rect x="0" y="10" width="90" height="95" rx="16" fill="url(#cells)" stroke="#7544be" stroke-width="4"/>
    <path d="M14 18c24 20 38 45 62 76" fill="none" stroke="#fff" stroke-width="11"/>
    <path d="M105 58h74" stroke="#7141cc" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="188" y="10" width="90" height="95" rx="16" fill="url(#cells)" stroke="#7544be" stroke-width="4"/>
    <path d="M42 150h194" stroke="#a88adc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="77" cy="150" r="18" fill="#f59e0b"/>
    <circle cx="139" cy="150" r="18" fill="#34a853"/>
    <circle cx="201" cy="150" r="18" fill="#ec4899"/>
  </g>
  <text x="1008" y="422" text-anchor="middle" fill="#30283a" font-family="Arial,sans-serif" font-size="30" font-weight="700">Restore + classify</text>
  <path d="M330 320H450" stroke="#7141cc" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M738 320H858" stroke="#7141cc" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="286" y="552" width="628" height="70" rx="35" fill="#fff" opacity=".9"/>
  <text x="600" y="598" text-anchor="middle" fill="#51248f" font-family="Arial,sans-serif" font-size="31" font-weight="700">LOCATE  ·  UNDERSTAND  ·  RESTORE</text>
</svg>
