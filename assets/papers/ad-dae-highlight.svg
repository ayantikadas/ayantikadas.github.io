<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AD-DAE graphical highlight</title>
  <desc id="desc">A controlled shift in latent space generates a subject-preserving follow-up MRI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff9f5"/>
      <stop offset="1" stop-color="#ffe7dc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f9734b"/>
      <stop offset="1" stop-color="#d93b24"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#e45232"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <path d="M0 580C250 480 390 680 650 570s390 40 550-50v155H0Z" fill="#ef6844" opacity=".08"/>
  <text x="60" y="82" fill="#a82f1d" font-family="Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="4">CONTROLLED PROGRESSION</text>
  <g filter="url(#shadow)">
    <rect x="65" y="145" width="255" height="350" rx="34" fill="#fff"/>
    <rect x="472" y="145" width="255" height="350" rx="34" fill="#fff"/>
    <rect x="880" y="145" width="255" height="350" rx="34" fill="#fff"/>
  </g>
  <g transform="translate(118 190)">
    <rect width="150" height="180" rx="22" fill="#18201d"/>
    <ellipse cx="75" cy="90" rx="57" ry="74" fill="#d7d8d6"/>
    <path d="M75 25C50 34 39 58 43 83c4 25 17 54 32 71M75 25c25 9 36 33 32 58-4 25-17 54-32 71" fill="none" stroke="#7d827d" stroke-width="8"/>
    <path d="M61 73c-10 16-8 37 14 42 22-5 24-26 14-42-4 10-8 14-14 14s-10-4-14-14Z" fill="#303733"/>
  </g>
  <text x="192" y="422" text-anchor="middle" fill="#27312d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Baseline MRI</text>
  <g transform="translate(505 185)">
    <rect x="11" y="10" width="168" height="178" rx="30" fill="#fff1ec" stroke="#f27655" stroke-width="4"/>
    <g fill="#cfd3d0" stroke="#777f79" stroke-width="2">
      <rect x="36" y="38" width="24" height="112" rx="7"/>
      <rect x="69" y="38" width="24" height="112" rx="7"/>
      <rect x="102" y="38" width="24" height="112" rx="7"/>
      <rect x="135" y="38" width="24" height="112" rx="7"/>
    </g>
    <g fill="url(#accent)">
      <rect x="69" y="70" width="24" height="80" rx="7"/>
      <rect x="102" y="103" width="24" height="47" rx="7"/>
    </g>
    <text x="94" y="255" text-anchor="middle" fill="#a82f1d" font-family="Arial,sans-serif" font-size="34" font-weight="700">AD-DAE</text>
  </g>
  <g transform="translate(933 190)">
    <rect width="150" height="180" rx="22" fill="#18201d"/>
    <ellipse cx="75" cy="90" rx="61" ry="76" fill="#e0e1df"/>
    <path d="M75 24C47 33 36 58 41 84c5 27 19 55 34 71M75 24c28 9 39 34 34 60-5 27-19 55-34 71" fill="none" stroke="#858a85" stroke-width="8"/>
    <path d="M59 69c-12 19-9 44 16 50 25-6 28-31 16-50-5 12-9 17-16 17s-11-5-16-17Z" fill="#303733"/>
  </g>
  <text x="1008" y="422" text-anchor="middle" fill="#27312d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Follow-up MRI</text>
  <path d="M330 320H450" stroke="#e45232" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M738 320H858" stroke="#e45232" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="268" y="552" width="664" height="70" rx="35" fill="#fff" opacity=".88"/>
  <text x="600" y="598" text-anchor="middle" fill="#a82f1d" font-family="Arial,sans-serif" font-size="31" font-weight="700">PRESERVE IDENTITY  ·  CONTROL CHANGE</text>
